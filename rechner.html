<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fahrpreis berechnen — taxiwien.at</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;1,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14181C; --bg-panel:#1B2027; --bg-panel-2:#20262E;
    --gold:#C9A15A; --gold-dim:#8A7040; --green:#5BA97A;
    --text:#F2EFE9; --text-dim:#9AA1AC; --line:#2B323C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; padding:40px 6%; }
  .wrap{ max-width:640px; margin:0 auto; }
  a.back{ color:var(--text-dim); font-size:13px; text-decoration:none; }
  h1{ font-family:'Newsreader',serif; font-weight:500; font-size:28px; margin:16px 0 24px; }
  .meter{ background:var(--bg-panel); border:1px solid var(--line); border-radius:14px; padding:26px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim);
    margin-bottom:7px; font-family:'IBM Plex Mono',monospace; }
  .field input{ width:100%; background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text);
    padding:12px 14px; border-radius:8px; font-size:14px; font-family:inherit; }
  gmp-place-autocomplete{
    width:100%; display:block;
    background-color: var(--bg-panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color-scheme: dark;
  }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .toggle-row{ display:flex; align-items:center; gap:10px; background:var(--bg-panel-2); border:1px solid var(--line);
    border-radius:8px; padding:12px 14px; height:48px; }
  .toggle-row input{ width:auto; }
  .tarif-info{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--green); padding:8px 14px;
    border:1px solid var(--gold-dim); border-radius:20px; display:inline-block; margin:6px 0 20px; }
  .result{ border-top:1px dashed var(--line); padding-top:20px; margin-top:6px; }
  .price-label{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1.5px; font-family:'IBM Plex Mono',monospace; }
  .price-value{ font-family:'IBM Plex Mono',monospace; font-size:42px; font-weight:600; color:var(--gold); margin:4px 0; }
  .breakdown{ font-size:13px; color:var(--text-dim); margin-top:10px; line-height:1.9; font-family:'IBM Plex Mono',monospace; }
  .breakdown span{ color:var(--text); }
  .status{ font-size:13px; color:var(--text-dim); margin-top:14px; min-height:18px; }
  .status.error{ color:#D77; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Zurück</a>
  <h1>Fahrpreis berechnen</h1>

  <div class="meter">
    <div class="field">
      <label>Von</label>
      <div id="from-container"></div>
    </div>
    <div class="field">
      <label>Nach</label>
      <div id="to-container"></div>
    </div>

    <div class="row3">
      <div class="field">
        <label>Personen</label>
        <input id="personen" type="number" value="1" min="1" max="8">
      </div>
      <div class="field">
        <label>Gepäckstücke</label>
        <input id="gepaeck" type="number" value="0" min="0" max="10">
      </div>
      <div class="field">
        <label>Haustier?</label>
        <div class="toggle-row">
          <input id="haustier" type="checkbox">
          <span style="font-size:13px;">ja, dabei</span>
        </div>
      </div>
    </div>

    <div class="tarif-info" id="tarifInfo">Tarif wird erkannt...</div>

    <button onclick="berechnen()" style="width:100%; background:var(--gold); color:#14181C; border:none;
      padding:14px; border-radius:8px; font-weight:700; font-size:14px; cursor:pointer;">Preis berechnen</button>

    <div class="status" id="status">Adressfelder werden geladen...</div>

    <div class="result" id="result" style="display:none;">
      <div class="price-label">Fahrpreis</div>
      <div class="price-value" id="priceValue">€ 0,00</div>
      <div class="breakdown" id="breakdown"></div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://nzyhmeowvwvbejlngvsb.supabase.co/";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56eWhtZW93dnd2YmVqbG5ndnNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MzMyNjIsImV4cCI6MjEwMDUwOTI2Mn0.1QoSdLCvlxYJwDL_wLmccCAhHZWBiWZLrt9FYAVTXBA";

  let aktuellerTarif = 'tag';
  let fromPlace = null;
  let toPlace = null;
  let globalerZuschlag = 0;

  function tarifAutomatischErkennen(){
    const jetzt = new Date();
    const wienZeit = new Date(jetzt.toLocaleString('en-US', { timeZone: 'Europe/Vienna' }));
    const wochentag = wienZeit.getDay();
    const stunde = wienZeit.getHours();

    let nacht = false;
    if(wochentag === 0){
      nacht = true;
    } else if(stunde >= 23 || stunde < 6){
      nacht = true;
    }

    aktuellerTarif = nacht ? 'nacht' : 'tag';
    const info = document.getElementById('tarifInfo');
    info.textContent = nacht
      ? '🌙 Nachttarif aktiv (So/23:00–05:59)'
      : '☀️ Tagtarif aktiv (Mo–Sa 06:00–22:59)';
  }

  async function ladeZuschlag(){
    try{
      const res = await fetch(SUPABASE_URL + "/rest/v1/einstellungen?select=zuschlag_prozent&order=id.asc&limit=1", {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      });
      const data = await res.json();
      if(data.length > 0){
        globalerZuschlag = parseFloat(data[0].zuschlag_prozent) || 0;
      }
    } catch(err){
      console.warn('Zuschlag konnte nicht geladen werden, verwende 0%.');
    }
  }

  async function init(){
    tarifAutomatischErkennen();
    await ladeZuschlag();

    try{
      const { PlaceAutocompleteElement } = await google.maps.importLibrary("places");

      const fromAutocomplete = new PlaceAutocompleteElement({ includedRegionCodes: ["at"] });
      document.getElementById('from-container').appendChild(fromAutocomplete);

      const toAutocomplete = new PlaceAutocompleteElement({ includedRegionCodes: ["at"] });
      document.getElementById('to-container').appendChild(toAutocomplete);

      fromAutocomplete.addEventListener('gmp-select', async ({ placePrediction }) => {
        const place = placePrediction.toPlace();
        await place.fetchFields({ fields: ['location', 'formattedAddress'] });
        fromPlace = place;
        document.getElementById('status').textContent = '';
      });

      toAutocomplete.addEventListener('gmp-select', async ({ placePrediction }) => {
        const place = placePrediction.toPlace();
        await place.fetchFields({ fields: ['location', 'formattedAddress'] });
        toPlace = place;
        document.getElementById('status').textContent = '';
      });

      document.getElementById('status').textContent = 'Bereit. Adresse eingeben und aus der Liste wählen.';
    } catch(err){
      document.getElementById('status').textContent = 'Fehler beim Laden der Adressfelder: ' + err.message;
      document.getElementById('status').className = 'status error';
    }
  }

  function berechnen(){
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    status.className = 'status';
    result.style.display = 'none';

    if(!fromPlace || !toPlace){
      status.textContent = 'Bitte Start- und Zieladresse aus den Vorschlägen auswählen.';
      status.className = 'status error';
      return;
    }

    status.textContent = 'Route wird berechnet...';

    const service = new google.maps.DistanceMatrixService();
    service.getDistanceMatrix({
      origins: [fromPlace.location],
      destinations: [toPlace.location],
      travelMode: 'DRIVING',
      unitSystem: google.maps.UnitSystem.METRIC
    }, (response, status_) => {
      if(status_ !== 'OK'){
        status.textContent = 'Route konnte nicht berechnet werden.';
        status.className = 'status error';
        return;
      }
      const element = response.rows[0].elements[0];
      if(element.status !== 'OK'){
        status.textContent = 'Keine Route zwischen diesen Adressen gefunden.';
        status.className = 'status error';
        return;
      }

      const distanceMeter = element.distance.value;
      const durationSekunden = element.duration.value;

      const preis = tarifBerechnen(distanceMeter, durationSekunden);
      anzeigen(preis, element.distance.text, element.duration.text);
      status.textContent = '';
    });
  }

  function tarifBerechnen(distanzMeter, dauerSekunden){
    let grundpreis, buchungsgebuehr, meterProEinheitBis5, meterProEinheitAb5, sekProEinheit;

    if(aktuellerTarif === 'tag'){
      grundpreis = 3.80;
      buchungsgebuehr = 2.00;
      meterProEinheitBis5 = 210.53;
      meterProEinheitAb5 = 344.83;
      sekProEinheit = 20.69;
    } else {
      grundpreis = 4.30;
      buchungsgebuehr = 0;
      meterProEinheitBis5 = 183.07;
      meterProEinheitAb5 = 299.85;
      sekProEinheit = 17.99;
    }

    const distanzBis5km = Math.min(distanzMeter, 5000);
    const distanzAb5km = Math.max(distanzMeter - 5000, 0);

    const einheitenBis5 = Math.ceil(distanzBis5km / meterProEinheitBis5);
    const einheitenAb5 = Math.ceil(distanzAb5km / meterProEinheitAb5);
    const einheitenZeit = Math.ceil(dauerSekunden / sekProEinheit);

    const kostenBis5 = einheitenBis5 * 0.20;
    const kostenAb5 = einheitenAb5 * 0.20;
    const kostenZeit = einheitenZeit * 0.20;

    const basispreis = grundpreis + buchungsgebuehr + kostenBis5 + kostenAb5 + kostenZeit;
    const endpreis = basispreis * (1 + globalerZuschlag / 100);

    return { endpreis, grundpreis, buchungsgebuehr, kostenBis5, kostenAb5, kostenZeit };
  }

  function anzeigen(p, distanzText, dauerText){
    const personen = document.getElementById('personen').value;
    const gepaeck = document.getElementById('gepaeck').value;
    const haustier = document.getElementById('haustier').checked;

    document.getElementById('priceValue').textContent = '€ ' + p.endpreis.toFixed(2).replace('.', ',');
    document.getElementById('breakdown').innerHTML =
      distanzText + ' · ' + dauerText + '<br>' +
      'Grundpreis: <span>' + p.grundpreis.toFixed(2) + ' €</span><br>' +
      (p.buchungsgebuehr > 0 ? 'Buchungsgebühr: <span>' + p.buchungsgebuehr.toFixed(2) + ' €</span><br>' : '') +
      'km-Anteil: <span>' + (p.kostenBis5 + p.kostenAb5).toFixed(2) + ' €</span><br>' +
      'Zeit-Anteil: <span>' + p.kostenZeit.toFixed(2) + ' €</span><br>' +
      '<br>👤 ' + personen + ' Person(en) · 🧳 ' + gepaeck + ' Gepäckstück(e)' +
      (haustier ? ' · 🐾 Haustier dabei' : '');
    document.getElementById('result').style.display = 'block';
  }
</script>

<script>
  (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
    key: "AIzaSyC3MzdN3BfJ-kl9jwLnWyKSMh5xJ30CmgM",
    v: "weekly",
  });
  init();
</script>

</body>
</html>
